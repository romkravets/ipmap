services:
  # ── Next.js frontend — єдиний сервіс, читає статичні JSON-датасети з public/data ──
  - type: web
    name: ipmap-web
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @ipmap/types build && node scripts/build-ipv4-data.mjs && node scripts/build-infra-data.mjs && NODE_OPTIONS=--max-old-space-size=450 pnpm --filter @ipmap/web build
    startCommand: pnpm --filter @ipmap/web start
    envVars:
      - key: NODE_ENV
        value: production
